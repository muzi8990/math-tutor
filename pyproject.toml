[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "math-tutor-python"
version = "0.1.0"
description = "Gemini image and text math tutor, without realtime audio or canvas dependencies"
requires-python = ">=3.11"
dependencies = ["google-genai>=2.29,<3", "Pillow>=11,<13", "pydantic>=2.12,<3", "pydantic-settings>=2.15,<3", "httpx>=0.28,<1", "fastapi>=0.141,<1", "uvicorn>=0.52,<1", "python-multipart>=0.0.32,<1", "loguru>=0.6,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
math-tutor = "math_tutor.cli:main"
math-tutor-worker = "math_tutor.mistakes.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/math_tutor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
